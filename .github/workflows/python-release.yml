name: Python Release
permissions:
  contents: read
on:
  release:
    types: [published]

jobs:
  release-test:
    name: Test Release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install libomp

      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --upgrade-strategy eager pip pip-tools suricata-check[performance]
          pip-compile --extra test -o requirements.txt pyproject.toml
          pip install -r requirements.txt

      - name: Test with pytest
        run: |
          pytest

  release-build:
    name: Build Release
    runs-on: ubuntu-latest
    needs:
      - release-test

    strategy:
      fail-fast: true

    steps:
      - name: Checkout release code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install most recent build dependencies
        run: |
          python -m pip install --upgrade --upgrade-strategy eager pip
          python -m pip install --upgrade --upgrade-strategy eager build pipdeptree

      - name: Output installed packages
        run: |
          pip freeze --all

      - name: Output dependency tree
        run: |
          pipdeptree

      - name: Build release distributions
        run: |
          python -m build

      - name: Upload windows dists
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-build
    environment:
      name: pypi
    permissions:
      id-token: write

    strategy:
      fail-fast: true

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  mcp-registry-publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs:
      - pypi-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Set server.json version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --upgrade packaging
          VERSION=$(python -c "import os; from packaging.version import Version; print(Version(os.environ['TAG']))")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Login to MCP Registry
        run: |
          ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher publish
